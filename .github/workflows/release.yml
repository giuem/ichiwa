# 推送形如 v2026.1107.1 的 tag 就是发布：构建 macOS 应用（Apple 芯片和
# Intel），给更新包签名，上传到这个 tag 的 release 并发布，已安装的应用
# 随即更新。tag 由 scripts/release.sh tag -push 带着 CHANGELOG 的提交一起
# 推送；RELEASING.md 说明整个流程。
name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要重新发布的 tag（v2026.1107.1）
        required: true

permissions:
  contents: write # release 和上传

# 一次只发一个：重推的 tag 等着，不会盖掉还在构建的那个。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the tag and stamp the version
        # 版本号不写在源码里：mygo.json 的 version 是 0.0.0-dev，发布时
        # 按 tag 写进去。
        run: |
          version="${TAG#v}"
          if ! echo "$version" | grep -Eq '^[0-9]{4}\.[1-9][0-9]{2,3}\.[1-9][0-9]*$'; then
            echo "::error::$TAG isn't a release version, YYYY.MDD.N (v2026.1107.1)"
            exit 1
          fi
          jq --arg v "$version" '.version = $v' mygo.json > mygo.json.new
          mv mygo.json.new mygo.json
      - name: Test
        run: go test ./...
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # The notes are the version's section of CHANGELOG.md.
            awk -v v="${TAG#v}" '
              /^## / { if (found) exit; found = ($0 == "## " v); next }
              found
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$TAG" --draft --title "$TAG" --target "$GITHUB_SHA" "${notes[@]}"
          fi
      # With a Developer ID certificate in the secrets, the app is signed with
      # it (set macos.signingIdentity and macos.notarize in mygo.json too);
      # without, it is signed ad hoc.
      - name: Import the certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        if: env.HAS_CERTIFICATE == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials notary --keychain "$keychain" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          fi
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform darwin/arm64,darwin/amd64 -upload
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
