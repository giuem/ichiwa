# Builds and tests on every push to main and every pull request, on each
# system the app is built for. Changes to documents alone run nothing.
name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "resources/**", "scripts/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "resources/**", "scripts/**"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -tags=nodynamic # HEIC posters decode the same everywhere, without a system libheif

jobs:
  # The checks that read the source the same on any system, on the one
  # that costs least.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: MyGo vet
        run: go tool mygo vet .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        shell: bash
        # The race detector needs cgo, which the Windows runner lacks a
        # compiler for by default.
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} ./...
      - name: Build
        run: go build ./...
