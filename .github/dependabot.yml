# Weekly updates of the Go modules, in one pull request, and monthly ones
# of the workflows' actions. Dependabot offers tagged versions only: a fix
# of openhongguo not released yet is still taken by hand.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
